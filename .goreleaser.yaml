# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: vaultctx

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

release:
  github:
    owner: moexx399
    name: vaultctx

checksum:
  name_template: checksums.txt

# Release notes come from changie (see .github/workflows/release.yml), so
# GoReleaser's own changelog generation is disabled.
changelog:
  disable: true

homebrew_casks:
  - name: vaultctx
    binaries: [vaultctx]
    homepage: https://github.com/moexx399/vaultctx
    description: Switch between HashiCorp Vault contexts and cache their tokens
    repository:
      owner: moexx399
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/vaultctx"]
          end
